# Local development database only. Production must use a managed,
# EU-hosted PostgreSQL with encryption at rest and TLS (see docs/security).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: k
      POSTGRES_PASSWORD: k_dev_password
      POSTGRES_DB: k_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - k-db:/var/lib/postgresql/data
volumes:
  k-db:
